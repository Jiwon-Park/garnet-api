name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_NAME: garnet-api

jobs:
  verify-build:
    name: Verify and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.25.x"
          cache: true

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Test
        run: go test ./...

      - name: Build linux amd64 and arm64
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o dist/${APP_NAME}-linux-amd64 .
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o dist/${APP_NAME}-linux-arm64 .

      - name: Upload linux amd64 artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.APP_NAME }}-linux-amd64
          path: dist/${{ env.APP_NAME }}-linux-amd64

      - name: Upload linux arm64 artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.APP_NAME }}-linux-arm64
          path: dist/${{ env.APP_NAME }}-linux-arm64

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/${{ env.APP_NAME }}-linux-*

  deploy:
    name: Deploy and restart
    runs-on: ubuntu-latest
    needs: verify-build
    environment: production
    steps:
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Select target binary
        id: target
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
        run: |
          arch="$(ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" "uname -m")"
          case "$arch" in
            x86_64|amd64)
              target_arch="amd64"
              ;;
            aarch64|arm64)
              target_arch="arm64"
              ;;
            *)
              echo "Unsupported deploy target architecture: $arch" >&2
              exit 1
              ;;
          esac
          binary="dist/${APP_NAME}-linux-${target_arch}"
          echo "arch=$target_arch" >> "$GITHUB_OUTPUT"
          echo "artifact=${APP_NAME}-linux-${target_arch}" >> "$GITHUB_OUTPUT"
          echo "binary=$binary" >> "$GITHUB_OUTPUT"
          echo "Detected deploy target architecture: $arch -> linux-${target_arch}"

      - name: Download target build artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ steps.target.outputs.artifact }}
          path: dist

      - name: Copy binary
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEST: ${{ vars.DEPLOY_PATH }}
          TARGET_BINARY: ${{ steps.target.outputs.binary }}
        run: |
          test -f "$TARGET_BINARY"
          chmod +x "$TARGET_BINARY"
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" "sudo mkdir -p '$DEST'"
          scp -i ~/.ssh/deploy_key "$TARGET_BINARY" "$DEPLOY_USER@$DEPLOY_HOST:~/${APP_NAME}.new"
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" "sudo install -m 0755 \"\$HOME/${APP_NAME}.new\" '$DEST/${APP_NAME}' && sudo rm -f \"\$HOME/${APP_NAME}.new\""

      - name: Install systemd unit
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_SERVICE: ${{ vars.DEPLOY_SERVICE }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
        run: |
          # Render the unit on the runner, scp to the target, install to /etc/systemd/system,
          # daemon-reload, and enable. The unit is generated from $DEPLOY_SERVICE (unit name)
          # and $DEPLOY_PATH (binary install directory) so the deploy config fully drives the
          # service definition; no static template is required in the repo.
          # Note: the deploy path must be readable by the service user. If DEPLOY_PATH is a
          # directory owned by a different user (e.g. /home/opc/project), grant the service
          # user read+execute access (chmod a+rx, or set ACLs) before the first restart.
          unit_path="/tmp/${DEPLOY_SERVICE}.service"
          cat > "$unit_path" <<EOF
          [Unit]
          Description=Garnet API Server
          After=network-online.target
          Wants=network-online.target

          [Service]
          Type=simple
          WorkingDirectory=${DEPLOY_PATH}
          EnvironmentFile=-/etc/garnet-api/garnet-api.env
          ExecStart=${DEPLOY_PATH}/${APP_NAME}
          Restart=always
          RestartSec=3
          KillSignal=SIGTERM
          TimeoutStopSec=10
          NoNewPrivileges=true
          PrivateTmp=true
          ProtectSystem=strict
          ProtectHome=true
          ReadWritePaths=${DEPLOY_PATH}
          LimitNOFILE=1048576

          [Install]
          WantedBy=multi-user.target
          EOF

          scp -i ~/.ssh/deploy_key "$unit_path" "$DEPLOY_USER@$DEPLOY_HOST:$unit_path"
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" \
            "sudo -n bash -c '
              id -u garnet-api >/dev/null 2>&1 || useradd --system --no-create-home --shell /usr/sbin/nologin garnet-api
              install -m 0644 $unit_path /etc/systemd/system/${DEPLOY_SERVICE}.service
              systemctl daemon-reload
              systemctl enable ${DEPLOY_SERVICE}
            '"

      - name: Restart service
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_SERVICE: ${{ vars.DEPLOY_SERVICE }}
        run: |
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" "sudo systemctl restart '$DEPLOY_SERVICE'"
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" "sudo systemctl is-active --quiet '$DEPLOY_SERVICE'"
