name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_NAME: garnet-api
  # hdTrans engine source built into libhdTransEngine.so. Pin with the HDTRANS_REF repository variable.
  HDTRANS_REPO: sokcuri/hdTrans
  HDTRANS_REF: ${{ vars.HDTRANS_REF || 'v0.9.5' }}

jobs:
  build:
    name: Build linux ${{ matrix.goarch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - goarch: amd64
            runner: ubuntu-latest
          - goarch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Checkout hdTrans
        uses: actions/checkout@v7
        with:
          repository: ${{ env.HDTRANS_REPO }}
          ref: ${{ env.HDTRANS_REF }}
          path: hdtrans

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.25.x"
          cache: true

      - name: Build hdTrans engine and dictionary snapshot
        working-directory: hdtrans
        run: |
          cmake --preset linux
          cmake --build --preset linux --parallel
          mkdir -p build/linux/hdtrans-data
          build/linux/hdtrans --dicts dicts --compile-snapshot "$PWD/build/linux/hdtrans-data/dicts.hdsnap"

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Test
        env:
          CGO_ENABLED: "1"
          CGO_LDFLAGS: -L${{ github.workspace }}/hdtrans/build/linux
          LD_LIBRARY_PATH: ${{ github.workspace }}/hdtrans/build/linux
        run: go test ./...

      - name: Build package
        env:
          CGO_ENABLED: "1"
          CGO_LDFLAGS: -L${{ github.workspace }}/hdtrans/build/linux
        run: |
          mkdir -p dist/pkg
          GOOS=linux GOARCH=${{ matrix.goarch }} go build -trimpath -ldflags="-s -w" -o dist/pkg/${APP_NAME} .
          cp hdtrans/build/linux/libhdTransEngine.so dist/pkg/
          cp -r hdtrans/build/linux/hdtrans-data dist/pkg/
          chmod 0644 dist/pkg/libhdTransEngine.so
          chmod -R a+rX dist/pkg/hdtrans-data
          tar -C dist/pkg -czf dist/${APP_NAME}-linux-${{ matrix.goarch }}.tar.gz ${APP_NAME} libhdTransEngine.so hdtrans-data

      - name: Upload linux ${{ matrix.goarch }} artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.APP_NAME }}-linux-${{ matrix.goarch }}
          path: dist/${{ env.APP_NAME }}-linux-${{ matrix.goarch }}.tar.gz

  release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: ${{ env.APP_NAME }}-linux-*
          path: dist
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/${{ env.APP_NAME }}-linux-*.tar.gz

  deploy:
    name: Deploy and restart
    runs-on: ubuntu-latest
    needs: build
    environment: production
    steps:
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Select target package
        id: target
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
        run: |
          arch="$(ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" "uname -m")"
          case "$arch" in
            x86_64|amd64)
              target_arch="amd64"
              ;;
            aarch64|arm64)
              target_arch="arm64"
              ;;
            *)
              echo "Unsupported deploy target architecture: $arch" >&2
              exit 1
              ;;
          esac
          package="dist/${APP_NAME}-linux-${target_arch}.tar.gz"
          echo "arch=$target_arch" >> "$GITHUB_OUTPUT"
          echo "artifact=${APP_NAME}-linux-${target_arch}" >> "$GITHUB_OUTPUT"
          echo "package=$package" >> "$GITHUB_OUTPUT"
          echo "Detected deploy target architecture: $arch -> linux-${target_arch}"

      - name: Download target build artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ steps.target.outputs.artifact }}
          path: dist

      - name: Copy binary and hdTrans engine
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEST: ${{ vars.DEPLOY_PATH }}
          TARGET_PACKAGE: ${{ steps.target.outputs.package }}
        run: |
          test -f "$TARGET_PACKAGE"
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" "sudo mkdir -p '$DEST'"
          scp -i ~/.ssh/deploy_key "$TARGET_PACKAGE" "$DEPLOY_USER@$DEPLOY_HOST:~/${APP_NAME}.tar.gz"
          # Extract into a staging directory first, then replace the files in DEST. install
          # unlinks the old binary, so the running service is not written to in place.
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" "set -e
            rm -rf \"\$HOME/${APP_NAME}-stage\" && mkdir -p \"\$HOME/${APP_NAME}-stage\"
            tar -xzf \"\$HOME/${APP_NAME}.tar.gz\" -C \"\$HOME/${APP_NAME}-stage\"
            sudo install -m 0755 \"\$HOME/${APP_NAME}-stage/${APP_NAME}\" '$DEST/${APP_NAME}'
            sudo install -m 0644 \"\$HOME/${APP_NAME}-stage/libhdTransEngine.so\" '$DEST/libhdTransEngine.so'
            sudo rm -rf '$DEST/hdtrans-data'
            sudo cp -r \"\$HOME/${APP_NAME}-stage/hdtrans-data\" '$DEST/hdtrans-data'
            sudo chmod -R a+rX '$DEST/hdtrans-data'
            rm -rf \"\$HOME/${APP_NAME}-stage\" \"\$HOME/${APP_NAME}.tar.gz\""

      - name: Install systemd unit
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_SERVICE: ${{ vars.DEPLOY_SERVICE }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
        run: |
          # Render the unit on the runner, scp to the target, install to /etc/systemd/system,
          # daemon-reload, and enable. The unit is generated from $DEPLOY_SERVICE (unit name)
          # and $DEPLOY_PATH (binary install directory) so the deploy config fully drives the
          # service definition; no static template is required in the repo.
          # Note: the deploy path must be readable by the service user. If DEPLOY_PATH is a
          # directory owned by a different user (e.g. /home/opc/project), grant the service
          # user read+execute access (chmod a+rx, or set ACLs) before the first restart.
          unit_path="/tmp/${DEPLOY_SERVICE}.service"
          cat > "$unit_path" <<EOF
          [Unit]
          Description=Garnet API Server
          After=network-online.target
          Wants=network-online.target

          [Service]
          Type=simple
          User=${DEPLOY_USER}
          Group=${DEPLOY_USER}
          WorkingDirectory=${DEPLOY_PATH}
          EnvironmentFile=-/etc/garnet-api/garnet-api.env
          ExecStart=${DEPLOY_PATH}/${APP_NAME}
          Restart=always
          RestartSec=3
          KillSignal=SIGTERM
          TimeoutStopSec=10
          NoNewPrivileges=true
          PrivateTmp=true
          ProtectSystem=strict
          ProtectHome=true
          ReadWritePaths=${DEPLOY_PATH}
          LimitNOFILE=1048576

          [Install]
          WantedBy=multi-user.target
          EOF

          scp -i ~/.ssh/deploy_key "$unit_path" "$DEPLOY_USER@$DEPLOY_HOST:$unit_path"
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" \
            "sudo -n bash -c '
              id -u garnet-api >/dev/null 2>&1 || useradd --system --no-create-home --shell /usr/sbin/nologin garnet-api
              install -m 0644 $unit_path /etc/systemd/system/${DEPLOY_SERVICE}.service
              systemctl daemon-reload
              systemctl enable ${DEPLOY_SERVICE}
            '"

      - name: Restart service
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_SERVICE: ${{ vars.DEPLOY_SERVICE }}
        run: |
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" "sudo systemctl restart '$DEPLOY_SERVICE'"
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" "sudo systemctl is-active --quiet '$DEPLOY_SERVICE'"
